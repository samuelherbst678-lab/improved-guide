<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parlament – Übersicht</title>
  <style>
    :root{
      --bg: #0b0b0f;
      --panel: #15151b;
      --card: #1b1b22;
      --stroke: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --muted2: rgba(255,255,255,.45);
      --shadow: 0 18px 40px rgba(0,0,0,.45);
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 700px at 50% -10%, rgba(255,255,255,.09), transparent 60%),
                  linear-gradient(180deg, #07070a 0%, #0b0b0f 60%, #060609 100%);
      color: var(--text);
      display:flex;
      justify-content:center;
      padding:20px 12px 40px;
    }

    .phone{
      width:min(420px, 96vw);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 26px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    .topbar{
      padding: 18px 18px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbar__title{
      font-size: 20px;
      font-weight: 800;
      letter-spacing:.2px;
    }
    .topbar__sub{
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted2);
    }

    .panel{
      padding: 16px 14px 6px;
    }
    .panel__title{
      margin: 0 0 10px 4px;
      font-size: 18px;
      font-weight: 900;
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 14px;
      margin: 10px 0;
    }
    .card--center{ text-align:center; }

    .card__heading{
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      position: relative;
      display:inline-block;
      padding-right: 10px;
    }
    .card__heading::after{
      content:"";
      position:absolute;
      left:0;
      right:-1000px;
      top: 52%;
      height:1px;
      background: rgba(255,255,255,.10);
      z-index:-1;
    }

    .row{
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .row--big{ padding: 4px 0 2px; }
    .icon{
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: rgba(0,0,0,.40);
      border: 1px solid rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      color: rgba(255,255,255,.85);
    }
    .row__title{
      font-size: 22px;
      font-weight: 900;
      line-height: 1.05;
    }
    .row__subtitle{
      margin-top: 4px;
      font-size: 15px;
      color: var(--muted);
    }

    .party-list{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .party-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.08);
    }
    .party-item__left{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .party-pill{
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      font-weight: 900;
      color: rgba(0,0,0,.78);
    }
    .party-name{
      font-size: 18px;
      font-weight: 900;
    }
    .party-lean{
      margin-top: 2px;
      font-size: 13px;
      color: var(--muted);
    }
    .chev{
      color: rgba(255,255,255,.35);
      font-size: 22px;
      user-select:none;
    }

    .seat-arc-wrap{
      display:flex;
      justify-content:center;
      margin: 6px 0 6px;
    }
    .seat-arc{
      width: 92%;
      max-width: 360px;
      height: auto;
    }
    .arc-outline{
      fill:none;
      stroke: rgba(255,255,255,.18);
      stroke-width: 14;
      stroke-linecap: butt;
    }
    .arc-seg{
      fill:none;
      stroke-width: 36;
      stroke-linecap: butt;
    }

    .muted{
      margin-top: 8px;
      font-weight: 900;
      font-size: 18px;
    }
    .legend{
      margin-top: 12px;
      display:grid;
      gap: 10px;
    }
    .legend-row{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items:end;
    }
    .legend-chip{
      padding: 9px 0;
      border-radius: 12px;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.10);
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .legend-num{
      margin-top: 8px;
      font-size: 18px;
      font-weight: 900;
      color: rgba(255,255,255,.80);
    }

    .split{
      display:grid;
      grid-template-columns: 120px 1fr 46px;
      align-items:center;
      gap: 12px;
      padding: 10px 2px;
    }
    .split__label{
      font-size: 20px;
      font-weight: 900;
    }
    .split__value{
      text-align:right;
      font-size: 22px;
      font-weight: 900;
      color: rgba(255,255,255,.80);
    }
    .split__bar{
      height: 54px;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
      display:flex;
      overflow:hidden;
    }
    .split__seg{
      height: 100%;
    }

    .footer{
      padding: 14px 16px 18px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: var(--muted2);
      font-size: 12px;
    }
    .footer code{
      color: rgba(255,255,255,.78);
    }
  </style>
</head>

<body>
  <main class="phone">
    <header class="topbar">
      <div class="topbar__title">Übersicht</div>
      <div class="topbar__sub">Regierung • Parlament • Ausrichtung</div>
    </header>

    <!-- Regierung -->
    <section class="panel">
      <h2 class="panel__title">Regierung</h2>

      <div class="card">
        <div class="card__heading">Politiker</div>
        <div class="row row--big">
          <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24">
              <path fill="currentColor" d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/>
            </svg>
          </div>
          <div class="row__text">
            <div class="row__title" id="leaderName">—</div>
            <div class="row__subtitle" id="leaderRole">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card__heading">Regierungsparteien</div>
        <div id="govPartiesList" class="party-list"></div>
      </div>
    </section>

    <!-- Parlament -->
    <section class="panel">
      <h2 class="panel__title">Parlament</h2>

      <div class="card card--center">
        <div class="seat-arc-wrap">
          <svg id="seatArc" class="seat-arc" viewBox="0 0 600 360" role="img" aria-label="Sitzverteilung">
            <!-- arcs injected by JS -->
          </svg>
        </div>

        <div class="muted" id="seatsLabel">Sitze im Parlament: —</div>

        <div class="legend" id="legend"></div>
      </div>
    </section>

    <!-- Regierung & Opposition / Politische Ausrichtung -->
    <section class="panel">
      <h2 class="panel__title">Regierung &amp; Opposition</h2>

      <div class="card">
        <div class="split">
          <div class="split__label">Regierung</div>
          <div class="split__bar" id="govBar"></div>
          <div class="split__value" id="govCount">—</div>
        </div>

        <div class="split">
          <div class="split__label">Opposition</div>
          <div class="split__bar" id="oppBar"></div>
          <div class="split__value" id="oppCount">—</div>
        </div>
      </div>

      <h2 class="panel__title" style="margin-top:18px;">Politische Ausrichtung</h2>

      <div class="card">
        <div class="split">
          <div class="split__label">Links</div>
          <div class="split__bar" id="leftBar"></div>
          <div class="split__value" id="leftCount">—</div>
        </div>

        <div class="split">
          <div class="split__label">Rechts</div>
          <div class="split__bar" id="rightBar"></div>
          <div class="split__value" id="rightCount">—</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer__hint">Editierbar oben im <code>CONFIG</code> (Regierungschef, Parteien, Farben, Sitze, Landtagsgröße)</div>
    </footer>
  </main>

  <script>
    /**
     * ✅ HIER EDITIERST DU ALLES.
     * - leader.name / role: Regierungschef
     * - totalSeats: Landtagsgröße
     * - parties: Namen, Farben, Sitze, Regierung ja/nein, Links/Rechts-Einordnung
     *
     * alignment: "left" | "right"
     * leanLabel: Text unter Parteiname in der Regierungsbox (z.B. "Mitte-rechts")
     */

    const CONFIG = {
      leader: {
        name: "Markus Söder",
        role: "Ministerpräsident"
      },

      totalSeats: 203,

      parties: [
        { key: "gruene", name: "Grüne", color: "#0a8a16", seats: 32, inGovernment: false, alignment: "left",  leanLabel: "Links" },
        { key: "spd",    name: "SPD",   color: "#e00000", seats: 17, inGovernment: false, alignment: "left",  leanLabel: "Links" },
        { key: "csu",    name: "CSU",   color: "#111111", seats: 85, inGovernment: true,  alignment: "right", leanLabel: "Mitte-rechts" },
        { key: "fw",     name: "FW",    color: "#ff8c00", seats: 37, inGovernment: true,  alignment: "right", leanLabel: "Mitte-rechts" },
        { key: "afd",    name: "AfD",   color: "#77c7ff", seats: 32, inGovernment: false, alignment: "right", leanLabel: "Rechts" }
      ]
    };

    /* ----------------------------- helpers ----------------------------- */

    function $(id){ return document.getElementById(id); }

    function polarToCartesian(cx, cy, r, angleDeg){
      const rad = (angleDeg - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    // SVG arc path from angleStart to angleEnd (degrees)
    function describeArc(cx, cy, r, startAngle, endAngle){
      const start = polarToCartesian(cx, cy, r, endAngle);
      const end   = polarToCartesian(cx, cy, r, startAngle);
      const largeArcFlag = (endAngle - startAngle) <= 180 ? "0" : "1";
      return `M ${start.x.toFixed(3)} ${start.y.toFixed(3)} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x.toFixed(3)} ${end.y.toFixed(3)}`;
    }

    function sumSeats(arr){ return arr.reduce((a,p)=>a + (p.seats||0), 0); }

    function textColorOn(bgHex){
      const hex = bgHex.replace("#","").trim();
      const r = parseInt(hex.substring(0,2),16);
      const g = parseInt(hex.substring(2,4),16);
      const b = parseInt(hex.substring(4,6),16);
      const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
      return lum > 0.62 ? "rgba(0,0,0,.78)" : "rgba(255,255,255,.92)";
    }

    /* ----------------------------- render ----------------------------- */

    function renderLeader(){
      $("leaderName").textContent = CONFIG.leader.name;
      $("leaderRole").textContent = CONFIG.leader.role;
    }

    function renderGovParties(){
      const wrap = $("govPartiesList");
      wrap.innerHTML = "";

      const gov = CONFIG.parties.filter(p => p.inGovernment);

      gov.forEach(p => {
        const item = document.createElement("div");
        item.className = "party-item";

        const left = document.createElement("div");
        left.className = "party-item__left";

        const pill = document.createElement("div");
        pill.className = "party-pill";
        pill.style.background = p.color;
        pill.style.color = textColorOn(p.color);
        pill.textContent = "›"; // optisch ähnlich dem Icon-Button

        const text = document.createElement("div");
        const name = document.createElement("div");
        name.className = "party-name";
        name.textContent = p.name;

        const lean = document.createElement("div");
        lean.className = "party-lean";
        lean.textContent = p.leanLabel || "";

        text.appendChild(name);
        text.appendChild(lean);

        left.appendChild(pill);
        left.appendChild(text);

        const chev = document.createElement("div");
        chev.className = "chev";
        chev.textContent = "›";

        item.appendChild(left);
        item.appendChild(chev);
        wrap.appendChild(item);
      });
    }

    function renderLegend(){
      const legend = $("legend");
      legend.innerHTML = "";

      const row1 = document.createElement("div");
      row1.className = "legend-row";

      const row2 = document.createElement("div");
      row2.className = "legend-row";

      CONFIG.parties.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "legend-chip";
        chip.style.background = p.color;
        chip.style.color = textColorOn(p.color);
        chip.textContent = p.name;

        const num = document.createElement("div");
        num.className = "legend-num";
        num.textContent = p.seats;

        row1.appendChild(chip);
        row2.appendChild(num);
      });

      legend.appendChild(row1);
      legend.appendChild(row2);

      $("seatsLabel").textContent = `Sitze im Parlament: ${CONFIG.totalSeats}`;
    }

    function renderSeatArc(){
      const svg = $("seatArc");
      svg.innerHTML = "";

      const total = CONFIG.totalSeats;
      const sum = sumSeats(CONFIG.parties);

      // Wenn Sitze nicht exakt passen: proportional skalieren (sieht stabil aus).
      const scale = sum > 0 ? (total / sum) : 1;

      // Geometry: semicircle 180° from 180 to 0
      const cx = 300, cy = 300;
      const r = 190;

      // Outline
      const outline = document.createElementNS("http://www.w3.org/2000/svg", "path");
      outline.setAttribute("d", describeArc(cx,cy,r,180,0));
      outline.setAttribute("class", "arc-outline");
      svg.appendChild(outline);

      // segments
      let angle = 180;
      const gapDeg = 1.2; // kleine Lücken wie im Screenshot

      CONFIG.parties.forEach((p, idx) => {
        const seatsScaled = p.seats * scale;
        const segDeg = (seatsScaled / total) * 180;

        const start = angle;
        const end   = angle - segDeg;

        const segStart = start - (idx === 0 ? 0 : gapDeg/2);
        const segEnd   = end   + (idx === CONFIG.parties.length-1 ? 0 : gapDeg/2);

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", describeArc(cx,cy,r, segStart, segEnd));
        path.setAttribute("class", "arc-seg");
        path.setAttribute("stroke", p.color);

        svg.appendChild(path);

        angle = end;
      });
    }

    function buildSplitBar(containerId, parts){
      const el = $(containerId);
      el.innerHTML = "";

      const total = parts.reduce((a,x)=>a + x.value, 0) || 1;

      parts.forEach(part => {
        const seg = document.createElement("div");
        seg.className = "split__seg";
        seg.style.width = `${(part.value / total) * 100}%`;
        seg.style.background = part.color;
        el.appendChild(seg);
      });
    }

    function renderGovOppAndAlignment(){
      const gov = CONFIG.parties.filter(p => p.inGovernment);
      const opp = CONFIG.parties.filter(p => !p.inGovernment);

      const govCount = Math.round(sumSeats(gov));
      const oppCount = Math.round(sumSeats(opp));

      $("govCount").textContent = govCount;
      $("oppCount").textContent = oppCount;

      buildSplitBar("govBar", gov.map(p => ({ color:p.color, value:p.seats })));
      buildSplitBar("oppBar", opp.map(p => ({ color:p.color, value:p.seats })));

      const left = CONFIG.parties.filter(p => p.alignment === "left");
      const right = CONFIG.parties.filter(p => p.alignment === "right");

      const leftCount = Math.round(sumSeats(left));
      const rightCount = Math.round(sumSeats(right));

      $("leftCount").textContent = leftCount;
      $("rightCount").textContent = rightCount;

      buildSplitBar("leftBar", left.map(p => ({ color:p.color, value:p.seats })));
      buildSplitBar("rightBar", right.map(p => ({ color:p.color, value:p.seats })));
    }

    function validateConfig(){
      if (!CONFIG.totalSeats || CONFIG.totalSeats <= 0) {
        console.warn("CONFIG.totalSeats fehlt oder ist ungültig.");
      }
      if (!Array.isArray(CONFIG.parties) || CONFIG.parties.length === 0) {
        console.warn("CONFIG.parties ist leer.");
      }
      CONFIG.parties.forEach(p => {
        if (!p.name || !p.color) console.warn("Partei unvollständig:", p);
      });
    }

    function render(){
      validateConfig();
      renderLeader();
      renderGovParties();
      renderSeatArc();
      renderLegend();
      renderGovOppAndAlignment();
    }

    render();
  </script>
</body>
</html>
